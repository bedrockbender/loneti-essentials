name: Android emulator smoke
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Android release tag to test
        default: android-v2.4.2
        type: string
      public_screens:
        description: Only capture screenshots of the public signed-out Russian home page
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'android/tests/**'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'android-v2.4.2' }}
        run: gh release download "$RELEASE_TAG" --repo bedrockbender/loneti-essentials --pattern Loneti-essentials.apk --dir "$RUNNER_TEMP/loneti-apk"
      - name: Install smoke test SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Enable hardware acceleration when available
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo "KVM is unavailable. The emulator action will use software acceleration."
          fi
      - name: Smoke test the signed APK
        env:
          LONETI_PUBLIC_SCREENS: ${{ inputs.public_screens && 'true' || 'false' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/run-smoke.sh "$RUNNER_TEMP/loneti-apk/Loneti-essentials.apk"
      - name: Save Android screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/loneti-screenshots/*.png
          if-no-files-found: error
