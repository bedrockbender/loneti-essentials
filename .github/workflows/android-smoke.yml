name: Android emulator smoke
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-smoke.yml'
      - 'android/tests/**'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the signed Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-v1.0.0 --pattern Loneti-Smile-Collector.apk --dir "$RUNNER_TEMP/loneti-apk"
      - name: Install smoke test SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.1'
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Smoke test the signed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/tests/run-smoke.sh "$RUNNER_TEMP/loneti-apk/Loneti-Smile-Collector.apk"
